spring:
  # DashScope Key 用占位符，取值见 config/secrets.properties（不入库）
  config:
    import: optional:file:./config/secrets.properties
  # MySQL 数据库配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/ai_passage_creator
    username: root
    password: qwer1234567
  # session 配置
  session:
    store-type: redis
    # session 30 天过期
    timeout: 2592000
  # Redis 配置
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      password:
  # 通义千问（DashScope）
  ai:
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:your-api-key-here}

server:
  servlet:
    # cookie 30 天过期
    session:
      cookie:
        max-age: 2592000

mybatis-flex:
  configuration:
    # 结果集：不要把列名按下划线转驼峰。列名本身就是驼峰。
    map-underscore-to-camel-case: false

# springdoc-openapi 配置
springdoc:
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.aiarticle.controller

# knife4j 接口文档配置
knife4j:
  enable: true
  setting:
    language: zh_cn
