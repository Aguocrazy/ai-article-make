spring:
  # DashScope Key 用占位符，取值见 config/secrets.properties（不入库）
  config:
    import: optional:file:./config/secrets.properties
  # MySQL 数据库配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/ai_passage_creator
    username: root
    password: qwer1234567
  # session 配置
  session:
    store-type: redis
    # session 30 天过期
    timeout: 2592000
  # Redis 配置
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      password:
  # MVC 异步超时须与 SseEmitterService.TIMEOUT_MILLIS（30 分钟）对齐，否则 Tomcat 会在约 30s 关掉 SSE
  mvc:
    async:
      request-timeout: 30m
  # 通义千问（DashScope）
  ai:
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:your-api-key-here}
      chat:
        options:
          # qwen3.8-27b 是视觉语言模型，DashScope 必须走多模态端点，否则报 url error
          model: qwen3.8-27b
          multi-model: true

# Pexels 图片检索
image:
  pexels:
    api-key: ${PEXELS_API_KEY:}
    base-url: https://api.pexels.com
    per-page: 1
    # API 无结果、未配置 Key 或请求失败时直接使用这些固定 CDN 图片
    fallback-urls:
      - https://images.pexels.com/photos/3573351/pexels-photo-3573351.png?auto=compress&cs=tinysrgb&fit=crop&h=627&w=1200
      - https://images.pexels.com/photos/2880507/pexels-photo-2880507.jpeg?auto=compress&cs=tinysrgb&fit=crop&h=627&w=1200
  # Iconify 图标检索（https://iconify.design/docs/api/queries.html），尚未按 method 分流
  iconify:
    base-url: https://api.iconify.design
    # 公开 API 最小 limit 为 32，实际只用第一条
    limit: 32

# Mermaid CLI（mmdc）图表生成
mermaid:
  # Windows 用 mmdc.cmd，Linux/Mac 用 mmdc
  cli-command: mmdc
  # transparent 为透明背景
  background-color: transparent
  # svg / png / pdf
  output-format: svg
  # 图片宽度（像素）
  width: 1200
  # 命令执行超时时间（毫秒）
  timeout: 30000

# 腾讯云 COS（密钥见 config/secrets.properties，未配置时工具类会报操作失败）
tencent:
  cos:
    # 访问管理 API 密钥 SecretId，对应 COS_SECRET_ID
    secret-id: ${COS_SECRET_ID:}
    # 访问管理 API 密钥 SecretKey，对应 COS_SECRET_KEY
    secret-key: ${COS_SECRET_KEY:}
    # 存储桶地域简称，如 ap-beijing、ap-guangzhou，对应 COS_REGION
    region: ${COS_REGION:ap-beijing}
    # 存储桶名称，格式一般为 <name>-<appid>，对应 COS_BUCKET
    bucket: ${COS_BUCKET:}
    # 对象键统一前缀（可为空），上传时会拼到 key 前面，对应 COS_KEY_PREFIX
    key-prefix: ${COS_KEY_PREFIX:}
    # 自定义访问域名（CDN 等，可为空）；为空则用桶默认域名，对应 COS_CUSTOM_DOMAIN
    custom-domain: ${COS_CUSTOM_DOMAIN:}

server:
  servlet:
    # cookie 30 天过期
    session:
      cookie:
        max-age: 2592000

mybatis-flex:
  configuration:
    # 结果集：不要把列名按下划线转驼峰。列名本身就是驼峰。
    map-underscore-to-camel-case: false

# springdoc-openapi 配置
springdoc:
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.aiarticle.controller

# knife4j 接口文档配置
knife4j:
  enable: true
  setting:
    language: zh_cn
